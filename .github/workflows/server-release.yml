# Checks that the server bundle builds for a release tag. It publishes
# nothing; releases are created by hand.
name: Server release build check (Linux binaries for LXC)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - name: Test
        working-directory: server
        run: dart pub get && dart test
      - name: Build bundle
        working-directory: server
        run: dart build cli -t bin/server.dart -o ../out
      - name: Package
        run: tar -czf famio-server-linux-${{ matrix.arch }}.tar.gz -C out bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: famio-server-linux-${{ matrix.arch }}
          path: famio-server-linux-${{ matrix.arch }}.tar.gz
