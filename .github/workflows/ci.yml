name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - name: Check release version
        run: dart tool/check_versions.dart
      - name: Shared package
        working-directory: packages/famio_shared
        run: dart pub get && dart analyze && dart test
      - name: Client package
        working-directory: packages/famio_client
        run: dart pub get && dart analyze && dart test
      - name: Server
        working-directory: server
        run: dart pub get && dart analyze && dart test && dart build cli -t bin/server.dart -o ../out

  flutter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          flutter-version: "3.44.8"
          channel: stable
      - name: Analyze and test
        working-directory: app
        run: flutter pub get && flutter analyze && flutter test
      - name: Web build smoke test
        working-directory: app
        run: flutter build web --release
