name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The privacy check reads the whole history and the tags.
          fetch-depth: 0
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - name: Privacy check (identities, messages, secrets)
        run: bash tool/repo_privacy_check.sh
      - name: Check release version
        run: dart tool/check_versions.dart
      - name: Shared package
        working-directory: packages/famio_shared
        run: dart pub get && dart analyze && dart test
      - name: Client package
        working-directory: packages/famio_client
        run: dart pub get && dart analyze && dart test
      - name: Server
        working-directory: server
        run: dart pub get && dart analyze && dart test && dart build cli -t bin/server.dart -o ../out

  flutter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.8"
          channel: stable
      - name: Analyze and test
        working-directory: app
        run: flutter pub get && flutter analyze && flutter test
      - name: Web build smoke test
        working-directory: app
        run: flutter build web --release

  # Compiles the native shells (Kotlin, Swift, C++) on every push, so a
  # broken platform build shows up before a release tag and not only then.
  native:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            runner: ubuntu-24.04
          - target: linux
            runner: ubuntu-24.04
          - target: windows
            runner: windows-latest
          - target: apple
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.8"
          channel: stable
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - if: matrix.target == 'android'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter pub get
      - if: matrix.target == 'android'
        run: |
          flutter build apk --debug --flavor prod
          cd android && ./gradlew :app:testDevDebugUnitTest --console=plain
      - if: matrix.target == 'linux'
        run: flutter build linux --debug
      - if: matrix.target == 'windows'
        run: flutter build windows --debug
      - name: macOS, iOS and the iOS unit tests
        if: matrix.target == 'apple'
        run: |
          flutter build macos --debug
          flutter build ios --simulator --debug
          device=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; print(next(d["udid"] for r in json.load(sys.stdin)["devices"].values() for d in r if d["name"].startswith("iPhone")))')
          cd ios && xcodebuild test -workspace Runner.xcworkspace -scheme Runner \
            -destination "id=$device" -only-testing:RunnerTests CODE_SIGNING_ALLOWED=NO

  # The integration tests that need no phone: the real Linux app against a
  # throwaway server per test, on a virtual display with a keyring.
  integration:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.8"
          channel: stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev \
            xvfb gnome-keyring dbus-x11
      - run: flutter pub get
      - name: Integration tests
        run: |
          dbus-run-session -- bash -c '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            xvfb-run -a -s "-screen 0 1600x1200x24" tool/integration_tests.sh linux
          '
