name: App release (Windows, Linux, macOS, Android)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            runner: windows-latest
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos
            runner: macos-latest
          - target: android
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - if: startsWith(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter pub get && flutter test

      - name: Windows
        if: matrix.target == 'windows'
        run: |
          flutter build windows --release
          cd build/windows/x64/runner/Release
          7z a "$GITHUB_WORKSPACE/famio-windows-x64.zip" .
      - name: Linux
        if: startsWith(matrix.target, 'linux')
        run: |
          flutter build linux --release
          arch=${{ matrix.target == 'linux-x64' && 'x64' || 'arm64' }}
          pkg="$GITHUB_WORKSPACE/famio-$arch"
          mkdir -p "$pkg"
          cp -r build/linux/$arch/release/bundle "$pkg/bundle"
          cp -r linux/packaging/icons linux/packaging/*.desktop linux/packaging/install.sh "$pkg/"
          tar -czf "$GITHUB_WORKSPACE/famio-${{ matrix.target }}.tar.gz" -C "$GITHUB_WORKSPACE" "famio-$arch"
      - name: macOS
        if: matrix.target == 'macos'
        run: |
          flutter build macos --release
          ditto -c -k --keepParent build/macos/Build/Products/Release/Famio.app "$GITHUB_WORKSPACE/famio-macos.zip"
      - name: Android
        if: matrix.target == 'android'
        run: |
          flutter build apk --release --flavor prod
          cp build/app/outputs/flutter-apk/app-prod-release.apk "$GITHUB_WORKSPACE/famio-android.apk"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: famio-*.*
      - uses: actions/upload-artifact@v4
        with:
          name: famio-${{ matrix.target }}
          path: famio-*.*
