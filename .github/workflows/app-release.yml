# Checks that every platform builds for a release tag. It publishes
# nothing: releases and their files are created by hand from the local
# release folder.
name: App release build check (Windows, Linux, macOS, Android)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            runner: windows-latest
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos
            runner: macos-latest
          - target: android
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.target != 'linux-arm64'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      # Flutter publishes no SDK archive for Linux on ARM: the tag from git.
      - if: matrix.target == 'linux-arm64'
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - if: startsWith(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - if: matrix.target == 'android'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter pub get && flutter test

      - name: Windows
        if: matrix.target == 'windows'
        run: |
          flutter build windows --release
          cd build/windows/x64/runner/Release
          7z a "$GITHUB_WORKSPACE/famio-windows-x64.zip" .
      - name: Linux
        if: startsWith(matrix.target, 'linux')
        run: |
          flutter build linux --release
          arch=${{ matrix.target == 'linux-x64' && 'x64' || 'arm64' }}
          pkg="$GITHUB_WORKSPACE/famio-$arch"
          mkdir -p "$pkg"
          cp -r build/linux/$arch/release/bundle "$pkg/bundle"
          cp -r linux/packaging/icons linux/packaging/*.desktop linux/packaging/install.sh "$pkg/"
          tar -czf "$GITHUB_WORKSPACE/famio-${{ matrix.target }}.tar.gz" -C "$GITHUB_WORKSPACE" "famio-$arch"
      - name: macOS
        if: matrix.target == 'macos'
        run: |
          flutter build macos --release
          ditto -c -k --keepParent build/macos/Build/Products/Release/Famio.app "$GITHUB_WORKSPACE/famio-macos.zip"
      - name: Android
        if: matrix.target == 'android'
        run: |
          flutter build apk --release --flavor prod
          cp build/app/outputs/flutter-apk/app-prod-release.apk "$GITHUB_WORKSPACE/famio-android.apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: famio-${{ matrix.target }}
          path: famio-*.*
