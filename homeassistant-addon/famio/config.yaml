name: Famio
version: "2.0.18"
slug: famio
description: Familien-Organizer in der Seitenleiste – als eigener Server oder verbunden mit eurem Famio-Server.
url: https://gitea.status403.de/dasevo-digital/Famio
arch:
  - aarch64
  - amd64
# No "image": Home Assistant builds the add-on from the Dockerfile, which
# fetches the signed server package of this version from the release.
init: false
startup: application
ingress: true
ingress_port: 8765
panel_icon: mdi:home-heart
panel_title: Famio
ports:
  8765/tcp: 8765
  8766/tcp: 8766
ports_description:
  8765/tcp: Famio-Server für Home-Assistant-Ingress (API verlangt HTTPS)
  8766/tcp: Famio-Server für die Apps (HTTPS mit eigenem Zertifikat)
# server_url and server_fingerprint are listed (empty) so that Home
# Assistant shows them: optional fields without a value only appear after
# "show unused optional configuration options". The server checks the
# address (an empty one in client mode stops it with a message).
options:
  mode: server
  ingress_auth: true
  server_url: ""
  server_fingerprint: ""
schema:
  # server: Famio runs in Home Assistant. client: only the sidebar,
  # connected to the family's Famio server elsewhere (server_url).
  mode: list(server|client)
  ingress_auth: bool
  server_url: str?
  server_fingerprint: str?
