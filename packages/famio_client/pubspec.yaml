name: famio_client
description: Famio client core - API client, offline store and sync engine.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.7
  famio_shared:
    path: ../famio_shared
  http: ^1.6.0
  sqlite3: ^3.8.0
  web: ^1.1.2
  web_socket_channel: ^3.0.3
dev_dependencies:
  fake_async: ^1.3.3
  famio_server:
    path: ../../server
  lints: ^6.1.0
  shelf: ^1.4.2
  test: ^1.32.0
  timezone: ^0.11.1

# Encrypted local databases (SQLite3MultipleCiphers), also for the tests.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
