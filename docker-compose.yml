# Standalone server (NAS, Raspberry Pi, any Docker host): docker compose up -d
# The server runs as user 65532, not root. On Linux, before the first start
# (and once when updating from an image before 1.0.11):
#   mkdir -p data keys && sudo chown -R 65532:65532 data keys
# Optional own map tiles: docker compose --profile maps up -d
services:
  famio:
    build: .
    container_name: famio
    restart: unless-stopped
    # Hardening: read-only image, no Linux capabilities, no privilege gain.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      # Home network access for the apps. Behind a reverse proxy on the same
      # host use "127.0.0.1:8765:8765" (or deploy/npm/docker-compose.yml), so
      # nothing bypasses HTTPS.
      - "127.0.0.1:8765:8765"
      # HTTPS with Famio's own certificate for apps in the home network.
      - "8766:8766"
    volumes:
      - ./data:/data
      # Encryption key for database and files. Kept apart from ./data so a
      # backup of the data alone is useless – back it up separately!
      - ./keys:/keys
    environment:
      # Time zone of the family: calendar feeds and imported calendars.
      TZ: Europe/Berlin
      FAMIO_KEY_FILE: /keys/famio.key
      # Plain HTTP is limited to loopback above and rejected for API access
      # from the network. Set this explicitly to "false" only while migrating
      # an old client that cannot use the HTTPS port yet.
      FAMIO_REQUIRE_TLS: "true"
      # Address under which Famio is reachable from the internet (HTTPS via a
      # reverse proxy). Needed for Google Calendar to subscribe to Famio feeds;
      # Apple Calendar in the home network works without it.
      # FAMIO_PUBLIC_URL: https://famio.example.org/
      # Behind a reverse proxy only (see deploy/npm/README.md):
      # FAMIO_TRUST_PROXY: "true"
      # FAMIO_MAX_UPLOAD_MB: "100"
      # Precise location history is deleted server-side after this period.
      # FAMIO_LOCATION_HISTORY_DAYS: "7"

  # Optional, deliberately separated map service. It is not started by the
  # normal `docker compose up -d`, needs no Famio credentials and sees no
  # family data. Put licensed .pmtiles/.mbtiles archives in ./map-tiles and
  # publish it only through the existing HTTPS reverse proxy.
  martin:
    image: ghcr.io/maplibre/martin:1.16.1@sha256:59902019bf9038926ff0c71174237d6852e64c457830a6349abe7090be8818ca
    container_name: famio-martin
    profiles: ["maps"]
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./map-tiles:/tiles:ro
      - ./deploy/maps/martin.yaml:/config/martin.yaml:ro
    command: ["--config", "/config/martin.yaml"]
