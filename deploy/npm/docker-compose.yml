# Famio behind Nginx Proxy Manager (NPM) on the same Docker host.
#
# Famio joins NPM's Docker network and publishes no port of its own: only NPM
# can reach it, which is why trusting X-Forwarded-For is safe here.
#
#   1. Adjust FAMIO_PUBLIC_URL and the network name below.
#   2. The server runs as user 65532, not root; on Linux once:
#      mkdir -p data keys && sudo chown -R 65532:65532 data keys
#   3. docker compose up -d
#   4. docker logs famio   -> shows the setup code for the first account
#   5. In NPM add a proxy host (see deploy/npm/README.md).
services:
  famio:
    build: ../..
    # image: ghcr.io/YOUR_GITHUB_USER/famio-amd64:latest
    container_name: famio
    restart: unless-stopped
    # Hardening: read-only image, no Linux capabilities, no privilege gain.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      # Apps in the home network may also use Famio's own HTTPS directly.
      - "8766:8766"
    volumes:
      - ./data:/data
      # Encryption key, apart from the data (back it up separately).
      - ./keys:/keys
    environment:
      TZ: Europe/Berlin
      FAMIO_PUBLIC_URL: https://famio.example.de/
      FAMIO_TRUST_PROXY: "true"
      FAMIO_KEY_FILE: /keys/famio.key
      # Only NPM (HTTPS) and port 8766 – no plain HTTP from the network.
      FAMIO_REQUIRE_TLS: "true"
      FAMIO_MAX_UPLOAD_MB: "100"
    networks:
      - npm

  # Optional own PMTiles/MBTiles service. Start with
  # `docker compose --profile maps up -d`; NPM can reach it as `martin:3000`.
  martin:
    image: ghcr.io/maplibre/martin:1.16.1@sha256:59902019bf9038926ff0c71174237d6852e64c457830a6349abe7090be8818ca
    container_name: famio-martin
    profiles: ["maps"]
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - ./map-tiles:/tiles:ro
      - ../maps/martin.yaml:/config/martin.yaml:ro
    command: ["--config", "/config/martin.yaml"]
    networks:
      - npm

networks:
  npm:
    external: true
    # `docker network ls` shows it, often "<npm-folder>_default".
    name: nginx-proxy-manager_default
